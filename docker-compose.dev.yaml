version: '3.8'

services:
  postgres:
    container_name: fleet-postgres
    image: postgres:16
    restart: always
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/
    env_file:
      - .env
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $POSTGRES_USER']
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      [
        'postgres',
        '-c',
        'shared_buffers=256MB',
        '-c',
        'work_mem=64MB',
        '-c',
        'maintenance_work_mem=64MB',
        '-c',
        'effective_cache_size=1GB',
        '-c',
        'max_connections=100',
      ]

  redis-starter:
    container_name: fleet-redis
    image: 'redis:6.2-alpine'
    restart: always
    environment:
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    command: /bin/sh -c "redis-server --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81"
    ports:
      - '6379:6379'
    volumes:
      - './redis_data:/bitnami/redis-starter/data'

  fleet-api:
    container_name: fleet-api
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - /tmp:/tmp
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis-starter:
        condition: service_started
    ports:
      - 8000:3000
    restart: always
